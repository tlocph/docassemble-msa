metadata:
  title: Marital Settlement Agreement
  short title: MSA
  description: |
    Generates a California Marital Settlement Agreement (without minor
    children) for a pending dissolution of marriage.
  authors:
    - organization: docassemble-msa
  revision_date: 2026-06-10
---
features:
  navigation: True
  progress bar: True
---
sections:
  - Introduction
  - Parties
  - Case information
  - Property
  - Debts
  - Spousal support
  - Download
---
mandatory: True
code: |
  intro_seen
  nav.set_section('Parties')
  husband_name
  nav.set_section('Case information')
  case_number
  nav.set_section('Property')
  wife_separate_property_raw
  nav.set_section('Debts')
  husband_debt_raw
  nav.set_section('Spousal support')
  spousal_support_waived
  nav.set_section('Download')
  final_screen
---
section: Introduction
question: |
  Marital Settlement Agreement
subquestion: |
  This interview prepares a **Marital Settlement Agreement** for a
  dissolution of marriage pending in the Superior Court of California.
  It covers:

  * Division of community property and confirmation of separate property
  * Responsibility for debts
  * Spousal support (waiver or monthly payments)

  This version of the agreement is for marriages **without minor
  children** — it does not include child custody or child support terms.

  You will need your case number, the dates of marriage and separation,
  and a list of any property or debts to be divided.

  **This interview does not provide legal advice.** Consider having an
  attorney review the finished agreement before signing or filing it.
continue button field: intro_seen
---
section: Parties
question: |
  Who are the parties?
subquestion: |
  Enter each spouse's name exactly as it appears in the court filings.
fields:
  - "Husband's full name": husband_name
  - "Wife's full name": wife_name
  - Which spouse is the Petitioner (the one who filed the case)?: petitioner_is
    input type: radio
    choices:
      - Husband
      - Wife
  - note: |
      ---
      **Petitioner's contact information** (appears in the heading of the
      document, as the party filing In Pro Per)
  - Street address: petitioner_address
  - City: petitioner_city
  - State: petitioner_state
    default: CA
    code: states_list()
  - Zip code: petitioner_zip
  - Telephone number: petitioner_phone
---
section: Case information
question: |
  Tell us about the case and the marriage.
fields:
  - County where the case is pending: county
    default: Los Angeles
    hint: e.g., Los Angeles
  - Case number: case_number
    hint: e.g., 26TRFL00405
  - Date of marriage: marriage_date_raw
    datatype: date
  - Date of separation: separation_date_raw
    datatype: date
  - Date of this agreement: agreement_date_raw
    datatype: date
    default: ${ today() }
  - Number of children born during the marriage: num_children
    datatype: integer
    min: 0
    default: 0
    help: |
      This agreement does not include custody or child support terms.
      If there are minor children of the marriage, those issues must be
      addressed separately.
validation code: |
  if separation_date_raw < marriage_date_raw:
    validation_error("The date of separation cannot be before the date of marriage.", field="separation_date_raw")
---
section: Property
question: |
  Property division
subquestion: |
  List each item on its own line. **Leave a box blank** if there is no
  property in that category — the agreement will say "No Property."

  Personal belongings (jewelry, furniture, clothing, vehicles) already
  divided between the parties are covered by a standard clause and do
  not need to be listed here.
fields:
  - note: |
      **Separate property** (owned before the marriage, or received by
      gift or inheritance)
  - "Wife's separate property": wife_separate_property_raw
    input type: area
    rows: 3
    required: False
  - "Husband's separate property": husband_separate_property_raw
    input type: area
    rows: 3
    required: False
  - note: |
      ---
      **Community property being transferred**
  - Community property Wife is transferring to Husband: property_to_husband_raw
    input type: area
    rows: 3
    required: False
  - Community property Husband is transferring to Wife: property_to_wife_raw
    input type: area
    rows: 3
    required: False
---
section: Debts
question: |
  Responsibility for debts
subquestion: |
  List each debt on its own line (for example, "Chase credit card ending
  in 1234"). **Leave a box blank** if that spouse is simply responsible
  for his or her own debts — the agreement will say "Each party will be
  responsible for their own debt."
fields:
  - Debts Husband will be responsible for: husband_debt_raw
    input type: area
    rows: 3
    required: False
  - Debts Wife will be responsible for: wife_debt_raw
    input type: area
    rows: 3
    required: False
---
section: Spousal support
question: |
  Spousal support
fields:
  - Are both parties waiving spousal support?: spousal_support_waived
    datatype: yesnoradio
  - Who will pay spousal support?: support_payor
    input type: radio
    choices:
      - Husband
      - Wife
    show if:
      variable: spousal_support_waived
      is: False
  - Monthly amount: support_amount
    datatype: currency
    show if:
      variable: spousal_support_waived
      is: False
  - First payment date: support_start_date_raw
    datatype: date
    show if:
      variable: spousal_support_waived
      is: False
  - When does support end?: support_end_text
    default: the death of either party, the remarriage of the supported party, or further order of the court, whichever occurs first
    input type: area
    rows: 2
    show if:
      variable: spousal_support_waived
      is: False
---
code: |
  if petitioner_is == "Husband":
    petitioner_name = husband_name
    respondent_name = wife_name
  else:
    petitioner_name = wife_name
    respondent_name = husband_name
---
code: |
  petitioner_city_state_zip = petitioner_city + ", " + petitioner_state + " " + petitioner_zip
---
code: |
  marriage_date = format_date(marriage_date_raw, format='MMMM d, yyyy')
  separation_date = format_date(separation_date_raw, format='MMMM d, yyyy')
  agreement_date = format_date(agreement_date_raw, format='MMMM d, yyyy')
---
code: |
  if num_children == 0:
    children_text = "no children were born"
  elif num_children == 1:
    children_text = "one child was born"
  else:
    children_text = str(num_children) + " children were born"
---
code: |
  items = [line.strip() for line in wife_separate_property_raw.splitlines() if line.strip()]
  wife_separate_property_text = comma_and_list(items) if items else "No Property"
  items = [line.strip() for line in husband_separate_property_raw.splitlines() if line.strip()]
  husband_separate_property_text = comma_and_list(items) if items else "No Property"
  items = [line.strip() for line in property_to_husband_raw.splitlines() if line.strip()]
  property_to_husband_text = comma_and_list(items) if items else "No Property"
  items = [line.strip() for line in property_to_wife_raw.splitlines() if line.strip()]
  property_to_wife_text = comma_and_list(items) if items else "No Property"
  del items
---
code: |
  items = [line.strip() for line in husband_debt_raw.splitlines() if line.strip()]
  husband_debt_text = comma_and_list(items) if items else "Each party will be responsible for their own debt."
  items = [line.strip() for line in wife_debt_raw.splitlines() if line.strip()]
  wife_debt_text = comma_and_list(items) if items else "Each party will be responsible for their own debt."
  del items
---
code: |
  if spousal_support_waived:
    spousal_support_text = "The parties agree voluntarily to waive any rights and forever give up the right to claim spousal support."
  else:
    support_payee = "Wife" if support_payor == "Husband" else "Husband"
    spousal_support_text = (
      support_payor + " shall pay to " + support_payee
      + " spousal support in the amount of " + currency(support_amount)
      + " per month, payable on the first day of each month, commencing on "
      + format_date(support_start_date_raw, format='MMMM d, yyyy')
      + ", and continuing until " + support_end_text.strip().rstrip('.') + "."
    )
---
event: final_screen
section: Download
question: |
  Your Marital Settlement Agreement is ready.
subquestion: |
  Review the document carefully before signing. Both parties must sign
  and date the agreement, and it must be submitted to the court for the
  judge's signature.

  Use the **Back** button or the navigation menu to make corrections.
attachment:
  name: Marital Settlement Agreement
  filename: Marital_Settlement_Agreement
  description: |
    Marital Settlement Agreement for ${ petitioner_name } and ${ respondent_name },
    Case No. ${ case_number }
  docx template file: Marital_Settlement_Agreement.docx
  valid formats:
    - pdf
    - docx
